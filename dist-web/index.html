<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#171a21" />
    <meta name="description" content="Мнемонические карточки для изучения слов" />

    <!--
      PWA: «Поделиться → На экран „Домой"» запускает приложение без строк браузера,
      то есть на весь экран. На iOS это единственный способ полного экрана: все
      тамошние браузеры на WebKit, а он не поддерживает Fullscreen API для страниц.
      В Telegram работает свой нативный requestFullscreen — там эти теги не нужны.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Карточки" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <title>Карточки слов</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      /*
       * Страховка на случай, когда файл приложения не доехал: на слабой связи и через VPN
       * это случается, и раньше пользователь видел просто белый экран без единого слова.
       * Теперь он получает объяснение и кнопку перезагрузки.
       */
      (function () {
        var BOOT_TIMEOUT_MS = 10000;
        var reported = false;

        function fail(reason) {
          if (reported || window.__appBooted) return;
          reported = true;

          var host = document.getElementById('app');
          if (!host) return;

          var box = document.createElement('div');
          box.setAttribute(
            'style',
            'min-height:100vh;display:flex;flex-direction:column;align-items:center;' +
              'justify-content:center;gap:14px;padding:24px;text-align:center;' +
              'font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;' +
              'color:#e8eaef;background:#0f1115'
          );

          var title = document.createElement('p');
          title.setAttribute('style', 'margin:0;font-size:17px;font-weight:600');
          title.textContent = 'Не удалось загрузить приложение';

          var hint = document.createElement('p');
          hint.setAttribute('style', 'margin:0;color:#9aa3b2;max-width:34ch');
          hint.textContent = reason;

          var btn = document.createElement('button');
          btn.setAttribute(
            'style',
            'padding:12px 22px;font:inherit;font-weight:600;color:#fff;background:#6c9eff;' +
              'border:none;border-radius:14px;cursor:pointer'
          );
          btn.textContent = 'Обновить';
          btn.onclick = function () {
            location.reload();
          };

          box.appendChild(title);
          box.appendChild(hint);
          box.appendChild(btn);
          host.replaceChildren(box);
        }

        // Файл приложения не загрузился — ошибки ресурсов не всплывают, ловим на фазе перехвата.
        window.addEventListener(
          'error',
          function (e) {
            if (e.target && e.target !== window && e.target.src) {
              fail('Похоже, пропала связь. Проверьте интернет и попробуйте ещё раз.');
            }
          },
          true
        );

        // Загрузился, но не запустился за отведённое время.
        setTimeout(function () {
          fail('Проверьте соединение и попробуйте ещё раз.');
        }, BOOT_TIMEOUT_MS);
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-DWijSNJc.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BJVLY5qB.css">
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
