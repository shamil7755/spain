<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Проверка WebView</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      body {
        margin: 0;
        background: #0f1115;
        color: #9fe8a0;
        font: 13px/1.6 ui-monospace, monospace;
        padding: 16px;
      }
      pre {
        white-space: pre-wrap;
        word-break: break-word;
        margin: 0;
      }
      .bad {
        color: #ffb4b4;
      }
    </style>
  </head>
  <body>
    <pre id="out">Скрипт не выполнился.</pre>
    <script>
      (function () {
        var lines = [];
        var NL = String.fromCharCode(10);

        function flush() {
          document.getElementById('out').textContent = lines.join(NL);
        }

        function add(line) {
          lines.push(line);
          flush();
        }

        add('1. Inline-скрипт выполнился');

        var tg = window.Telegram && window.Telegram.WebApp;
        add('2. Telegram SDK: ' + (tg ? 'есть' : 'НЕТ'));

        if (tg) {
          add('3. version: ' + (tg.version || '?') + ', platform: ' + (tg.platform || '?'));
          add('4. initData: ' + (tg.initData ? 'есть, ' + tg.initData.length + ' симв.' : 'ПУСТО'));
          try {
            tg.ready();
            tg.expand();
            add('5. ready/expand отработали');
          } catch (e) {
            add('5. ready/expand упали: ' + e.message);
          }
        }

        try {
          localStorage.setItem('__t', '1');
          localStorage.removeItem('__t');
          add('6. localStorage: работает');
        } catch (e) {
          add('6. localStorage: ЗАБЛОКИРОВАН (' + e.name + ')');
        }

        // Проверяем, доходит ли запрос до нашего API.
        fetch('/api/health')
          .then(function (r) {
            return r.json();
          })
          .then(function (d) {
            add('7. /api/health: ' + JSON.stringify(d));
          })
          .catch(function (e) {
            add('7. /api/health НЕ ОТВЕТИЛ: ' + e.message);
          });

        // Проверяем, исполняется ли ES-модуль — это главный подозреваемый.
        var s = document.createElement('script');
        s.type = 'module';
        s.textContent = "window.__moduleOk = true; document.getElementById('out').textContent += String.fromCharCode(10) + '8. ES-модуль выполнился';";
        s.onerror = function () {
          add('8. ES-модуль НЕ загрузился');
        };
        document.head.appendChild(s);

        setTimeout(function () {
          if (!window.__moduleOk) {
            var el = document.createElement('div');
            el.className = 'bad';
            el.textContent = '8. ES-МОДУЛИ НЕ РАБОТАЮТ — вот причина белого экрана';
            document.body.appendChild(el);
          }
        }, 1500);
      })();
    </script>
  </body>
</html>
