<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#171a21" />
    <meta name="description" content="Мнемонические карточки для изучения слов" />
    <title>Карточки слов</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      // Временная диагностика: в WebView Telegram консоль недоступна,
      // поэтому состояние запуска и ошибки выводятся прямо на страницу.
      (function () {
        var log = []

        function paint() {
          var host = document.getElementById('app')
          if (!host) return
          var box = document.createElement('pre')
          box.style.cssText =
            'white-space:pre-wrap;word-break:break-word;padding:16px;margin:0;' +
            'font:12px/1.5 ui-monospace,monospace;color:#ffb4b4;background:#0f1115;min-height:100vh'
          box.textContent = log.join('
')
          host.replaceChildren(box)
        }

        function note(line) {
          log.push(line)
          paint()
        }

        document.addEventListener('DOMContentLoaded', function () {
          note('HTML загружен, ждём модуль приложения…')
          note('UA: ' + navigator.userAgent)
          var tg = window.Telegram && window.Telegram.WebApp
          note('Telegram SDK: ' + (tg ? 'есть' : 'НЕТ'))
          note('initData: ' + (tg && tg.initData ? 'есть (' + tg.initData.length + ' симв.)' : 'пусто'))
        })

        // true — ловим и ошибки загрузки файлов: они не всплывают до window.
        window.addEventListener(
          'error',
          function (e) {
            if (e.target && e.target !== window && e.target.src) {
              note('НЕ ЗАГРУЗИЛСЯ ФАЙЛ: ' + e.target.src)
            } else {
              note('ОШИБКА: ' + (e.message || '?') + ' @ ' + (e.filename || '') + ':' + (e.lineno || '?'))
            }
          },
          true,
        )

        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason
          note('ОШИБКА (promise): ' + ((r && (r.stack || r.message)) || String(r)))
        })
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
